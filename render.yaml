# Values with sync:false are supplied at creation, never committed as secrets.
# Existing services need those values set explicitly in their Environment page.
services:
  - type: web
    name: NEXUS
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readiness
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PROFILE
        value: portfolio
      - key: PUBLIC_REGISTRATION_ENABLED
        value: "false"
      - key: REDIS_ENABLED
        value: "false"
      - key: ENABLE_DOCS_IN_PRODUCTION
        value: "false"
      - key: ENABLE_METRICS_ENDPOINT
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: DB_TIMEOUT_SECONDS
        value: "10"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"

  - type: web
    name: nexus-portfolio-ui
    runtime: static
    branch: main
    # Keep all static-site paths repository-relative when adopting the existing
    # service, avoiding overlapping rootDir and publish-path updates in one sync.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
