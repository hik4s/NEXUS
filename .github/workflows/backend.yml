name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
      - "scripts/db-check.ps1"
      - "scripts/seed_demo.py"
      - "scripts/migrate_release.py"
      - "render.yaml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
      - "scripts/db-check.ps1"
      - "scripts/seed_demo.py"
      - "scripts/migrate_release.py"
      - "render.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://nexus_test:nexus_test@localhost:5432/nexus_test' || 'sqlite:///./data/ci.db' }}
      REDIS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Alembic check
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Tests
        run: python -m pytest -q
