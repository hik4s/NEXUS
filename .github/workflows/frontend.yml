name: frontend

on:
  push:
    paths: ['frontend/**', 'backend/**', 'scripts/seed_demo.py', 'demo/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'scripts/seed_demo.py', 'demo/**', '.github/workflows/frontend.yml']

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci
          POSTGRES_DB: nexus_e2e_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus_ci -d nexus_e2e_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_DATABASE_URL: postgresql+psycopg://nexus_ci:nexus_ci@127.0.0.1:5432/nexus_e2e_ci
      NEXUS_DEMO_PASSWORD: ci-only-demo-password-not-production
      NEXUS_PYTHON: python
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portfolio-browser-failure
          path: frontend/test-results
          retention-days: 7
